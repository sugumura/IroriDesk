[package]
name = "irori-desk"
version = "0.1.1"
description = "Irori Desk - a desktop viewer for Firestore and Firebase Authentication"
authors = ["sugumura"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "irori_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gcp_auth = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["fs", "process", "sync"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
base64 = "0.23.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
http = "1.5.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
