# タグ（v0.1.0 など）を push すると macOS / Windows / Linux 向けにビルドし、
# GitHub Releases に下書きとして登録する。内容を確認してから公開する
name: Release

# タグの push でのみ実行する（main への push では動かない）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 型チェック・テスト・clippy。通ったときだけ各 OS 向けにビルドする
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Linux の依存パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # tauri::generate_context! が dist を参照するため先にビルドする
      - run: pnpm build
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: タグと tauri.conf.json のバージョンが一致するか確認
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と tauri.conf.json の version ($version) が一致しません" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux の依存パッケージ
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # 公証用の API キー（.p8）を一時ファイルに書き出す
      - name: App Store Connect API キーを配置
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS の署名（Developer ID Application の .p12 を base64 にしたもの）
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          KEYCHAIN_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.KEYCHAIN_PASSWORD || '' }}
          # macOS の公証（App Store Connect API キー）
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Irori Desk ${{ github.ref_name }}"
          releaseBody: |
            ## ダウンロード
            - **macOS**（Apple Silicon / Intel）: `.dmg`
            - **Windows**: `.msi` または `-setup.exe`（署名なしのため SmartScreen の警告が出たら「詳細情報 → 実行」）
            - **Linux**: `.AppImage` / `.deb` / `.rpm`

            セットアップと使い方は [README](https://github.com/${{ github.repository }}#readme) を参照してください。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
