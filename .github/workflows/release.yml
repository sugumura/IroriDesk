# タグ（v0.2.0 など）を push すると macOS / Windows 向けにビルドして GitHub Releases に下書きとして登録し、
# すべて成功したら公開する（publish ジョブ）。タグに "-" を含む場合は下書きのまま残す
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          # Windows は SSL.com の個人向けコード署名証明書（eSigner）で署名する。Secrets が無ければ署名なし
          - platform: windows-latest
            args: ""
          # Linux はまだ配布しない。再開するときは次の行のコメントを外す
          # - platform: ubuntu-22.04
          #   args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Windows の署名の Secrets が登録されているか（`if` では secrets を直接参照できないため）
      HAS_WINDOWS_SIGNING: ${{ secrets.ES_USERNAME != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: タグと tauri.conf.json のバージョンが一致するか確認
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と tauri.conf.json の version ($version) が一致しません" >&2
            exit 1
          fi
          # 自動アップデートの署名に必要な鍵があるか（無いとビルドの最後で分かりにくく失敗するため、先に確認する）
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY is not set (see docs/DEVELOPMENT.md: Auto-update)" >&2
            exit 1
          fi
          if [ -z "$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")" ]; then
            echo "plugins.updater.pubkey in tauri.conf.json is empty (see docs/DEVELOPMENT.md: Auto-update)" >&2
            exit 1
          fi
          # CHANGELOG.md にこのバージョンの節があるか（無ければ失敗する）
          node scripts/release-notes.mjs "$version" > /dev/null

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux の依存パッケージ
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # 公証用の API キー（.p8）を一時ファイルに書き出す
      - name: App Store Connect API キーを配置
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Windows の署名（SSL.com eSigner）。Secrets が未登録なら署名せずにビルドする
      - uses: actions/setup-java@v4
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Windows の署名ツール（SSL.com CodeSignTool）を準備
        id: winsign
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        env:
          CODESIGNTOOL_VERSION: v1.3.2
        run: |
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          dir="$tmp/codesigntool"
          curl -fsSL -o "$tmp/codesigntool.zip" \
            "https://github.com/SSLcom/CodeSignTool/releases/download/$CODESIGNTOOL_VERSION/CodeSignTool-$CODESIGNTOOL_VERSION.zip"
          mkdir -p "$dir"
          unzip -q "$tmp/codesigntool.zip" -d "$dir"
          # zip の中にフォルダが1段あれば、その中を使う
          [ -d "$dir/jar" ] || dir="$(dirname "$(find "$dir" -type d -name jar -not -path '*__MACOSX*' | head -1)")"
          echo "CODESIGNTOOL_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
          echo "ESIGN_LOG=$(cygpath -w "$tmp/esigner.log")" >> "$GITHUB_ENV"
          script="$(cygpath -w "$GITHUB_WORKSPACE/scripts/sign-windows.ps1")"
          conf="$(cygpath -w "$tmp/tauri.sign.json")"
          node -e '
            const [conf, script] = process.argv.slice(1);
            require("fs").writeFileSync(conf, JSON.stringify({ bundle: { windows: { signCommand: {
              cmd: "pwsh", args: ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", script, "%1"] } } } }));
          ' "$conf" "$script"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"

      # リリースノート: ダウンロードの案内 + CHANGELOG.md のこのバージョンの節
      - name: リリースノートを作成
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          {
            echo "body<<__RELEASE_NOTES__"
            cat <<'EOF'
          ## Download
          - **macOS** (Apple Silicon / Intel): `IroriDesk_<version>_universal.dmg` — signed and notarized
          - **Windows** (x64): `IroriDesk_<version>_x64-setup.exe` or `IroriDesk_<version>_x64.msi`. If Windows SmartScreen shows "Windows protected your PC", click **More info → Run anyway** (see [CODE_SIGNING.md](https://github.com/sugumura/IroriDesk/blob/main/CODE_SIGNING.md)).

          Linux builds are not distributed yet. See the [README](https://github.com/sugumura/IroriDesk#readme) for setup and usage.

          ## Changes

          EOF
            node scripts/release-notes.mjs "$version" || echo "See [CHANGELOG.md](https://github.com/sugumura/IroriDesk/blob/main/CHANGELOG.md)."
            echo "__RELEASE_NOTES__"
          } | sed "s/<version>/$version/g" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS の署名（Developer ID Application の .p12 を base64 にしたもの）
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          KEYCHAIN_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.KEYCHAIN_PASSWORD || '' }}
          # macOS の公証（App Store Connect API キー）
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          # 自動アップデート用のファイルの署名（tauri signer generate で作った鍵。公開鍵は tauri.conf.json）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows の署名（scripts/sign-windows.ps1 が使う）
          ES_USERNAME: ${{ matrix.platform == 'windows-latest' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ matrix.platform == 'windows-latest' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ matrix.platform == 'windows-latest' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ matrix.platform == 'windows-latest' && secrets.ES_TOTP_SECRET || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Irori Desk ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # アプリ名（Irori Desk）の空白が GitHub で "." に置き換わるため、ファイル名は空白なしにする
          # 例: IroriDesk_0.2.0_universal.dmg / IroriDesk_0.2.0_x64-setup.exe / IroriDesk_0.2.0_x64.msi
          assetNamePattern: "IroriDesk_[version]_[arch][setup][ext]"
          # 自動アップデートの更新情報（latest.json）を Releases に載せる。Windows は NSIS のインストーラーを使う
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}

      # Tauri は署名コマンドの出力を表示しない（失敗しても "failed to run pwsh" だけ）ため、署名の記録を表示する
      - name: Windows の署名の記録
        if: always() && matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        run: cat "$(cygpath -u "$ESIGN_LOG")" 2>/dev/null || echo "署名の記録はありません（署名の前に失敗しました）"

  # 仕上げと公開。すべてのビルドが終わってから、
  # 1) 自動アップデートの更新情報（latest.json）の変更内容を CHANGELOG のそのバージョンの節だけにし
  #    （配布済みのアプリは文字のまま表示するため、ダウンロードの案内などを除く）、
  # 2) 全プラットフォームがそろっていることを確かめてから、リリースを公開する。
  # ビルドの途中で公開すると、latest.json に一部のプラットフォームしか無く、アップデートに失敗するため。
  # タグに "-" を含む場合（v0.8.0-rc.1 など）は下書きのまま残す
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: latest.json の notes を更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          node scripts/updater-notes.mjs "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --clobber
      - name: 全プラットフォームの更新情報があるか確認
        run: |
          node -e '
            const d = require(process.argv[1]);
            const need = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"];
            const missing = need.filter((p) => !d.platforms?.[p]?.signature || !d.platforms?.[p]?.url);
            if (missing.length) { console.error("latest.json is missing: " + missing.join(", ")); process.exit(1); }
            console.log("latest.json " + d.version + ": " + Object.keys(d.platforms).join(", "));
          ' "$RUNNER_TEMP/latest.json"
      - name: リリースを公開
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
